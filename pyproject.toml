[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yicenet"
version = "15.5.1"
description = "YiCeNet (易策网络) — I-Ching inspired tiny neural network for conversational navigation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["iching", "hexagram", "orchestration", "neural-network", "yicenet"]

authors = [
    {name = "ahillzhao-msn", email = "105655625+ahillzhao-msn@users.noreply.github.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "transformers>=4.35",
    "sentencepiece>=0.1",
    "tqdm>=4.60",
    "huggingface-hub>=0.20",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Source = "https://github.com/ahillzhao-msn/YiCeNet"
Documentation = "https://github.com/ahillzhao-msn/YiCeNet#readme"

[project.scripts]
yicenet-bootstrap = "yicenet.bootstrap:main"
yicenet-uninstall = "yicenet.bootstrap:uninstall_cli"
yicenet-serve = "yicenet.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yicenet"]
exclude = ["**/__pycache__/**", "**/*.pt", "**/*.pth"]

[tool.hatch.build.targets.sdist]
exclude = ["checkpoints/**", "data/**", ".venv/**", ".git/**"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
