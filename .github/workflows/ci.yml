name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify import
        run: |
          python -c "import yicenet; print(yicenet.__version__)"
          python -c "from yicenet import YiCeNetEngine, YiCeNet, YiCeNetConfig; print('Public API OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  native-hook:
    name: native hook client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native/yicenet-hook -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Smoke test (no daemon, no python -> silent exit 0)
        shell: bash
        run: |
          BIN=build/yicenet-hook; [ -f build/Release/yicenet-hook.exe ] && BIN=build/Release/yicenet-hook.exe
          OUT=$(echo "{}" | YICENET_DAEMON_PORT=1 YICENET_DAEMON_PYTHON= HOME=/nonexistent USERPROFILE=/nonexistent "$BIN" claude-code pre)
          test -z "$OUT"
