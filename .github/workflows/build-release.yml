# YiCeNet — Build wheel + GitHub Release
#
# Triggered by: push tag v*.*.* or manual workflow_dispatch.
#
# Release assets (per tag):
#   yicenet-VERSION-py3-none-any.whl  — pip wheel
#   yicenet_base.pt                   — base / seed model (~21 MB)
#   world_model.pt                    — world model (reward prediction)
#   registry.json                     — minimal registry (active only, no history)
#   INSTALL.md                        — installation guide
#   SOUL-template.md                  — YiCeNet identity template
#   install-claudecode-hooks.sh       — Claude Code hook installer
#   install-hermes-hooks.sh          — Hermes hook installer
#   flywheel-run.sh / .bat           — Environment-adaptive flywheel launcher
#   yicenet-hook-<os>-<arch>[.exe]    — native hook client (native/yicenet-hook)
#
# Stable names (yicenet_base.pt, world_model.pt) allow yicenet-bootstrap
# to auto-download from /releases/latest/download/ without knowing the version.

name: build-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v16.0.0) — used in release body only'
        required: false
        type: string

jobs:
  # ── Native hook client, one binary per platform ───────────────────────────
  native-hook:
    name: yicenet-hook (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-latest,   asset: yicenet-hook-windows-x64.exe, bin: build/Release/yicenet-hook.exe }
          - { os: ubuntu-latest,    asset: yicenet-hook-linux-x64,       bin: build/yicenet-hook }
          - { os: ubuntu-24.04-arm, asset: yicenet-hook-linux-arm64,     bin: build/yicenet-hook }
          - { os: macos-latest,     asset: yicenet-hook-macos-arm64,     bin: build/yicenet-hook }
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # bundle libstdc++/libgcc so the binary runs on any glibc distro
            cmake -S native/yicenet-hook -B build -DCMAKE_BUILD_TYPE=Release \
                  "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          else
            cmake -S native/yicenet-hook -B build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build --config Release
          mkdir -p out && cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"
      - name: Smoke test (no daemon → silent exit 0)
        shell: bash
        run: echo '{}' | YICENET_DAEMON_PORT=1 YICENET_DAEMON_PYTHON=/nonexistent "out/${{ matrix.asset }}" claude-code pre
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    name: Build & Release
    needs: native-hook
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required: create releases and upload assets

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python (for asset prep script) ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Build wheel ──────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel
        run: |
          ls -lah dist/
          WHL=$(ls dist/*.whl | head -1)
          python -c "import zipfile; z=zipfile.ZipFile('$WHL'); names=[n for n in z.namelist() if 'yicenet' in n]; print('wheel contents sample:', names[:5])"

      # ── Prepare release assets ───────────────────────────────────────────
      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release-assets

          # ── Wheel ──
          cp dist/*.whl release-assets/

          # ── Determine version string ──
          if echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]'; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(python -c "import sys; sys.path.insert(0,'src'); import yicenet; print(yicenet.__version__)")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using version: $VERSION"

          # ── Active checkpoint (registry.json → fallback minimal.pt) ──
          ACTIVE_PATH=$(python - <<'PYEOF'
          import json, os
          p = ''
          if os.path.exists('checkpoints/registry.json'):
              try:
                  reg = json.load(open('checkpoints/registry.json'))
                  p = reg.get('active', {}).get('path', '') or ''
              except Exception:
                  pass
          if p and os.path.exists(f'checkpoints/{p}'):
              print(p)
          elif os.path.exists('checkpoints/minimal.pt'):
              print('minimal.pt')
          else:
              print('', end='')
          PYEOF
          )
          echo "Active checkpoint path: '$ACTIVE_PATH'"

          if [ -z "$ACTIVE_PATH" ] || [ ! -f "checkpoints/$ACTIVE_PATH" ]; then
            echo "ERROR: active checkpoint '$ACTIVE_PATH' not found."
            echo "Contents of checkpoints/:"
            ls -la checkpoints/ || true
            exit 1
          fi
          echo "ACTIVE_PATH=$ACTIVE_PATH" >> "$GITHUB_ENV"

          cp "checkpoints/$ACTIVE_PATH" release-assets/yicenet_base.pt
          echo "  + yicenet_base.pt  (from $ACTIVE_PATH,  $(du -sh checkpoints/$ACTIVE_PATH | cut -f1))"

          # ── World model ──
          if [ -f "checkpoints/world_model_best.pt" ]; then
            cp checkpoints/world_model_best.pt release-assets/world_model.pt
            echo "  + world_model.pt  ($(du -sh checkpoints/world_model_best.pt | cut -f1))"
          else
            echo "  · world_model_best.pt not found — skipping world_model.pt"
          fi

          # ── Minimal release registry (clean, no flywheel history) ──
          python - <<PYEOF
          import json, os
          reg = json.load(open('checkpoints/registry.json'))
          active = reg.get('active', {})
          version = os.environ.get('VERSION', '')
          active_path = os.environ.get('ACTIVE_PATH', '')
          release_reg = {
            "_note": "Release registry — place in ~/.yicenet/checkpoints/ alongside yicenet_base.pt and world_model.pt",
            "active": {
              "version":    active.get("version", ""),
              "path":       "yicenet_base.pt",
              "avg_reward": active.get("avg_reward", 0),
              "created":    active.get("created", ""),
              "notes":      f"YiCeNet {version} release — base model (source: {active_path})"
            }
          }
          json.dump(release_reg, open('release-assets/registry.json', 'w'), indent=2)
          print("  + registry.json  (active:", release_reg["active"]["path"], ")")
          PYEOF

          # ── Documentation & install helpers ──
          for f in INSTALL.md SOUL-template.md; do
            [ -f "$f" ] && cp "$f" release-assets/ && echo "  + $f" || echo "  · $f not found"
          done
          for sh in scripts/install/install-claudecode-hooks.sh scripts/install/install-hermes-hooks.sh; do
            [ -f "$sh" ] && cp "$sh" release-assets/ && echo "  + $(basename $sh)" || echo "  · $(basename $sh) not found"
          done

          # ── Flywheel launcher scripts (environment-adaptive) ──
          for f in scripts/flywheel-run.sh scripts/flywheel-run.bat; do
            [ -f "$f" ] && cp "$f" release-assets/ && echo "  + $(basename $f)" || echo "  · $f not found"
          done

          echo ""
          echo "=== Final release assets ==="
          ls -lah release-assets/

      # ── Native hook binaries (from the native-hook job) ─────────────────
      - uses: actions/download-artifact@v4
        with:
          pattern: yicenet-hook-*
          path: release-assets
          merge-multiple: true

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Quick Install

            ```bash
            # 1. Install wheel
            pip install https://github.com/ahillzhao-msn/YiCeNet/releases/download/${{ github.ref_name }}/yicenet-${{ env.VERSION }}-py3-none-any.whl

            # 2. Bootstrap: downloads models, configures Hermes / Claude Code
            yicenet-bootstrap
            ```

            Or let `yicenet-bootstrap` handle everything — it auto-downloads `yicenet_base.pt`
            and `world_model.pt` from this release when no local checkpoint is found.

            ---

            ## Release Assets

            | File | Size | Purpose |
            |------|------|---------|
            | `yicenet-*.whl` | ~1 MB | pip wheel — the installable package |
            | `yicenet_base.pt` | ~22 MB | Base / seed model checkpoint |
            | `world_model.pt` | <1 MB | World model (flywheel reward prediction) |
            | `registry.json` | <1 KB | Checkpoint registry for `yicenet-bootstrap` |
            | `INSTALL.md` | — | Full installation guide |
            | `SOUL-template.md` | — | YiCeNet identity template (`~/.yicenet/SOUL.md`) |
            | `install-claudecode-hooks.sh` | — | Claude Code hook + MCP auto-installer |
            | `install-hermes-hooks.sh` | — | Hermes plugin installer |
            | `flywheel-run.sh` / `.bat` | — | Environment-adaptive flywheel launcher |
            | `yicenet-hook-<os>-<arch>` | ~0.2 MB | Native hook client for Claude Code / Kimi Code (`yicenet-bootstrap` installs it to `~/.yicenet/bin`) |

            ---

            ## Manual Model Setup (no bootstrap)

            ```bash
            mkdir -p ~/.yicenet/checkpoints
            cd ~/.yicenet/checkpoints
            BASE=https://github.com/ahillzhao-msn/YiCeNet/releases/download/${{ github.ref_name }}
            curl -LO $BASE/yicenet_base.pt
            curl -LO $BASE/world_model.pt
            curl -LO $BASE/registry.json
            ```

          files: |
            release-assets/*.whl
            release-assets/yicenet_base.pt
            release-assets/world_model.pt
            release-assets/registry.json
            release-assets/INSTALL.md
            release-assets/SOUL-template.md
            release-assets/install-claudecode-hooks.sh
            release-assets/install-hermes-hooks.sh
            release-assets/flywheel-run.sh
            release-assets/flywheel-run.bat
            release-assets/yicenet-hook-*
